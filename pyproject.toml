[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-vocab-grasping"
version = "0.1.0"
description = "Open-vocabulary perception-guided robotic grasping in PyBullet"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26,<2.3",
  "PyYAML>=6.0",
  "pybullet==3.2.7",
  "Pillow>=10",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "open3d==0.19.0",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11"]
yolo = ["ultralytics>=8.3,<9"]
ui = ["gradio>=5.49,<6"]
agent = ["httpx>=0.27,<1"]

[project.scripts]
ovg = "open_vocab_grasping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
