extends: gui_demo.yaml

# DeepSeek plans first; after validation, the robot pipeline opens a live
# PyBullet window and executes with real-time pacing.
agent:
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  timeout_s: 60.0
  max_tokens: 800
  thinking: disabled
  execution_mode: open-vocab-simple
