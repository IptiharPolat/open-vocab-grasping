extends: graspnet.yaml

# DeepSeek performs only validated high-level task planning. The robot backend
# for this config is the isolated official GraspNet service.
agent:
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  timeout_s: 60.0
  max_tokens: 800
  thinking: disabled
  execution_mode: open-vocab-graspnet
