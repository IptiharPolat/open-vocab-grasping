extends: default.yaml
seed: 7
scene:
  object_names: [box, bottle, bowl]
  num_objects: 3
  use_mesh_assets: false
camera:
  width: 256
  height: 192
  vertical_fov_deg: 60.0
  eye_world: [1.0, -0.85, 0.75]
grasp:
  generator: geometric_baseline
  target: box
detection:
  mode: oracle
filters:
  minimum_center_z_m: 0.015
  minimum_scene_clearance_m: 0.012
